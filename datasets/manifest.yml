# Attack datasets replayed against every rule on every pull request.
#
# Each dataset is pinned to an immutable commit URL and a SHA-256. `expect`
# lists rules that MUST fire on the dataset (with a minimum hit count). Any
# rule that fires on a dataset without being listed here fails the build, so
# every hit is either a reviewed true positive (add it to `expect`) or a
# documented false positive (add it to `known_fp` with a reason, then fix it).
#
# The OTRF datasets were recorded on lab hosts with normal background
# activity (Edge, Defender, Windows Update, logon noise), which makes them a
# useful, if small, false-positive baseline as well as a true-positive one.

sources:
  otrf:
    name: OTRF Security-Datasets
    homepage: https://github.com/OTRF/Security-Datasets
    license: MIT
    base_url: https://raw.githubusercontent.com/OTRF/Security-Datasets/d9d40ef123d2c87d5d3df28c96bcab4f0faccc87/datasets/atomic/windows/
