rule: proc_creation_esentutl_copy_credential_store
base: {Channel: Microsoft-Windows-Sysmon/Operational, EventID: 1, Image: 'C:\Windows\System32\esentutl.exe'}
match:
  - name: OTRF sample
    event: {CommandLine: 'esentutl.exe  /y /vss C:\windows/system32/config/SAM /d C:\ProgramData\SAM'}
  - name: ntds.dit
    event: {CommandLine: 'esentutl.exe /y /vss c:\windows\ntds\ntds.dit /d c:\temp\n.dit'}
no_match:
  - name: database integrity check
    event: {CommandLine: 'esentutl.exe /g C:\Windows\SoftwareDistribution\DataStore\DataStore.edb'}
  - name: copy of an unrelated file
    event: {CommandLine: 'esentutl.exe /y C:\Users\a\AppData\Local\Microsoft\Edge\User Data\Default\WebCache.dat /d c:\temp\w.dat'}
