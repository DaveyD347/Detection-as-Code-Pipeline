rule: win_security_zerologon_anonymous_machine_password_reset
base: {Channel: Security, EventID: 4742}
match:
  - name: OTRF mimikatz zerologon
    event: {SubjectUserName: ANONYMOUS LOGON, TargetUserName: 'MORDORDC$', PasswordLastSet: '9/16/2020 11:40:05 PM'}
no_match:
  - name: normal machine password rotation
    event: {SubjectUserName: 'WORKSTATION5$', TargetUserName: 'WORKSTATION5$', PasswordLastSet: '9/16/2020 11:40:05 PM'}
  - name: anonymous change that is not a password reset
    event: {SubjectUserName: ANONYMOUS LOGON, TargetUserName: 'MORDORDC$', PasswordLastSet: '-'}
