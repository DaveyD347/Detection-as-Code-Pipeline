rule: win_security_dcsync_replication_by_user
base: {Channel: Security, EventID: 4662, AccessMask: '0x100'}
match:
  - name: OTRF Empire DCSync
    event: {SubjectUserName: pgustavo, Properties: "%%7688\r\n\t\t{1131f6aa-9c07-11d1-f79f-00c04fc2dcd2}\r\n\t{19195a5b-6da0-11d0-afd3-00c04fd930c9}\r\n"}
  - name: Get-Changes-All
    event: {SubjectUserName: svc_backup, Properties: '%%7688 {1131f6ad-9c07-11d1-f79f-00c04fc2dcd2} {19195a5b-6da0-11d0-afd3-00c04fd930c9}'}
no_match:
  - name: domain controller replicating
    event: {SubjectUserName: 'DC02$', Properties: '%%7688 {1131f6ad-9c07-11d1-f79f-00c04fc2dcd2}'}
  - name: Entra Connect sync account
    event: {SubjectUserName: MSOL_1a2b3c4d5e6f, Properties: '%%7688 {1131f6ad-9c07-11d1-f79f-00c04fc2dcd2}'}
  - name: unrelated control access right
    event: {SubjectUserName: pgustavo, Properties: '%%7688 {00299570-246d-11d0-a768-00aa006e0529}'}
