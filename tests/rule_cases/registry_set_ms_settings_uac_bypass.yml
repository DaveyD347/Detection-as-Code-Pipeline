rule: registry_set_ms_settings_uac_bypass
base: {Channel: Microsoft-Windows-Sysmon/Operational, EventID: 13, EventType: SetValue}
match:
  - name: OTRF Empire fodhelper command
    event: {Image: 'C:\windows\System32\WindowsPowerShell\v1.0\powershell.exe', TargetObject: 'HKU\S-1-5-21-3125456671-949036322-3048627137-1104_Classes\ms-settings\Shell\Open\command\(Default)', Details: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoP -NonI -W Hidden -c $x=...'}
  - name: OTRF DelegateExecute
    event: {Image: 'C:\windows\System32\WindowsPowerShell\v1.0\powershell.exe', TargetObject: 'HKU\S-1-5-21-3125456671-949036322-3048627137-1104_Classes\ms-settings\Shell\Open\command\DelegateExecute', Details: (Empty)}
no_match:
  - name: other per-user protocol handler
    event: {Image: 'C:\Program Files\App\app.exe', TargetObject: 'HKU\S-1-5-21-1_Classes\myapp\shell\open\command\(Default)', Details: '"C:\Program Files\App\app.exe" "%1"'}
