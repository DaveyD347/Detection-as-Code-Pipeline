rule: proc_creation_reg_save_credential_hives
base: {Channel: Microsoft-Windows-Sysmon/Operational, EventID: 1, Image: 'C:\Windows\System32\reg.exe'}
match:
  - name: OTRF Empire sample
    event: {CommandLine: '"C:\windows\system32\reg.exe" save HKLM\sam sam'}
  - name: OTRF SYSTEM hive sample
    event: {CommandLine: 'reg  save HKLM\SYSTEM C:\Windows\Temp\SYSTEM_HIVE'}
  - name: long hive name, quoted
    event: {CommandLine: 'reg.exe save "HKEY_LOCAL_MACHINE\SECURITY" c:\perflogs\sec.hiv /y'}
no_match:
  - name: export of a SYSTEM subkey (OTRF background noise)
    event: {CommandLine: 'reg  export "HKLM\SYSTEM\CurrentControlSet\Control\Winlogon\Notifications"  Reg\Notif.reg.txt /y'}
  - name: query of SAM
    event: {CommandLine: 'reg query HKLM\SAM\SAM\Domains'}
