title: Volume Shadow Copy Created From the Command Line
id: daf87931-ad66-4ad7-a3bb-68a892e9ffae
status: test
description: |
  Detects vssadmin or wmic creating a volume shadow copy. Attackers create a
  snapshot to read locked files such as ntds.dit, SAM and SYSTEM. Backups
  normally go through the VSS API, not these command-line tools.
references:
  - https://attack.mitre.org/techniques/T1003/003/
author: DaveyD347
date: 2026-10-16
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - create
      - shadow
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - shadowcopy
      - create
  condition: 1 of selection_*
falsepositives:
  - Administrators scripting snapshots before maintenance.
level: medium
