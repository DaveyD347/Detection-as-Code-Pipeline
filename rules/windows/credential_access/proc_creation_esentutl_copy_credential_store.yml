title: Locked Credential Store Copied via esentutl
id: 99b6730b-91da-4ef5-9340-570745ba81d9
status: test
description: |
  Detects esentutl copying SAM, SYSTEM, SECURITY or ntds.dit. With /vss,
  esentutl reads the file through a shadow copy, bypassing the lock the OS
  holds on these databases.
references:
  - https://attack.mitre.org/techniques/T1003/002/
  - https://lolbas-project.github.io/lolbas/Binaries/Esentutl/
author: DaveyD347
date: 2026-10-16
tags:
  - attack.credential-access
  - attack.t1003.002
  - attack.t1003.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith: '\esentutl.exe'
    - OriginalFileName: esentutl.exe
  selection_copy:
    CommandLine|contains|windash: ' -y '
  selection_target:
    CommandLine|contains:
      - '/config/sam'
      - '\config\sam'
      - '/config/system'
      - '\config\system'
      - '/config/security'
      - '\config\security'
      - 'ntds.dit'
  condition: all of selection_*
falsepositives:
  - None expected.
level: high
