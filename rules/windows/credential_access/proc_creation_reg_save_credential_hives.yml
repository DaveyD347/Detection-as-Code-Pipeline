title: Credential Registry Hive Saved via reg.exe
id: 6fdfd5e3-788b-48b5-9e8e-dc2c75edb68d
status: test
description: |
  Detects reg.exe saving or exporting the SAM, SECURITY or SYSTEM hive. SAM
  plus SYSTEM is enough to recover local account NTLM hashes offline; SECURITY
  adds LSA secrets and cached domain credentials.
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: DaveyD347
date: 2026-10-16
tags:
  - attack.credential-access
  - attack.t1003.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith: '\reg.exe'
    - OriginalFileName: reg.exe
  selection_action:
    CommandLine|contains:
      - ' save '
      - ' export '
  # Whole hives only: 'hklm\system' followed by a space or quote, never by a
  # backslash. Exports of subkeys such as HKLM\SYSTEM\CurrentControlSet\...
  # are routine and showed up as noise in replay.
  selection_hive:
    CommandLine|contains:
      - 'hklm\sam '
      - 'hklm\sam"'
      - 'hkey_local_machine\sam '
      - 'hkey_local_machine\sam"'
      - 'hklm\security '
      - 'hklm\security"'
      - 'hkey_local_machine\security '
      - 'hkey_local_machine\security"'
      - 'hklm\system '
      - 'hklm\system"'
      - 'hkey_local_machine\system '
      - 'hkey_local_machine\system"'
  condition: all of selection_*
falsepositives:
  - Rare backup scripts that export entire hives.
level: high
