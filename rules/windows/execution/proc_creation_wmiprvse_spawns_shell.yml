title: WMI Provider Host Spawning a Shell or Script Host
id: 290f1923-6d5a-4101-baed-93430dae076d
status: test
description: |
  Detects WmiPrvSE.exe starting a command interpreter. Win32_Process.Create,
  whether called locally or remotely over DCOM (wmic /node, Invoke-WmiMethod,
  Impacket wmiexec, Empire invoke_wmi), executes the new process as a child of
  WmiPrvSE, so this catches WMI-based execution regardless of the client tool.
references:
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1021/003/
author: DaveyD347
date: 2026-10-16
tags:
  - attack.execution
  - attack.t1047
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith: '\WmiPrvSE.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  filter_werfault:
    CommandLine|contains: 'WerFault'
  condition: all of selection_* and not 1 of filter_*
falsepositives:
  - SCCM/MECM and some monitoring agents run scripts via WMI; exclude their specific command lines.
level: high
