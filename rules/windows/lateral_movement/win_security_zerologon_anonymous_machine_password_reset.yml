title: Zerologon - Computer Account Password Reset by ANONYMOUS LOGON
id: 4bc86b63-0112-4330-a347-4484c623cd01
status: test
description: |
  Detects a computer account being changed by ANONYMOUS LOGON with a new
  password-set time. Exploiting CVE-2020-1472 (Zerologon) authenticates to
  Netlogon with an all-zero credential and then resets the domain controller's
  machine account password, which Windows logs as an anonymous 4742.
references:
  - https://attack.mitre.org/techniques/T1210/
  - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2020-1472
author: DaveyD347
date: 2026-10-16
tags:
  - attack.lateral-movement
  - attack.t1210
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4742
    SubjectUserName: ANONYMOUS LOGON
  filter_no_password_change:
    PasswordLastSet: '-'
  condition: selection and not filter_no_password_change
falsepositives:
  - None; anonymous computer-account password changes are not a legitimate operation.
level: critical
