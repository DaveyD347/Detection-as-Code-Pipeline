title: Local Users or Administrators Enumerated via net.exe
id: e2b469de-9faf-47e3-ad88-bfd3b81eeeae
status: test
description: |
  Detects net.exe / net1.exe listing local users or local group membership.
  Individually this is low-fidelity (helpdesk does it daily); it is shipped
  at low severity as a building block for correlation with other activity
  from the same process tree, and to keep discovery visible in coverage.
references:
  - https://attack.mitre.org/techniques/T1087/001/
  - https://attack.mitre.org/techniques/T1069/001/
author: DaveyD347
date: 2026-10-16
tags:
  - attack.discovery
  - attack.t1087.001
  - attack.t1069.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith:
        - '\net.exe'
        - '\net1.exe'
    - OriginalFileName:
        - net.exe
        - net1.exe
  selection_user:
    CommandLine|endswith:
      - ' user'
      - ' users'
  selection_group:
    CommandLine|contains: ' localgroup'
  filter_domain:
    CommandLine|contains: ' /domain'
  condition: selection_img and (selection_user or selection_group) and not filter_domain
falsepositives:
  - Administrators and helpdesk staff; use for correlation rather than alerting on its own.
level: low
