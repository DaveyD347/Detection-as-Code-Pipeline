[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dac"
version = "0.1.0"
description = "Detection-as-code pipeline: Sigma rules, replay tests on real attack data, multi-SIEM conversion, ATT&CK coverage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DaveyD347" }]
dependencies = [
  "pySigma>=1.5,<2",
  "pySigma-backend-splunk>=2.1,<3",
  "pySigma-backend-elasticsearch>=2.1,<3",
  "pySigma-backend-kusto>=1.0,<2",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.6"]

[project.scripts]
dac = "dac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dac = ["data/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]
