# Rules a target cannot express faithfully, with the reason.
#
# `dac convert` fails when a rule fails to convert and is not listed here, and
# also when a listed rule starts converting again, so this file always matches
# reality. "Failed" includes queries pySigma produced that then failed one of
# the semantic checks in src/dac/convert.py.

known_gaps:
  sentinel:
    proc_access_lsass_unbacked_calltrace: >-
      Needs Sysmon EID 10 call stacks. Defender XDR has no process-access table with
      CallTrace; deploy via the Sysmon ASIM parser instead.
    proc_access_lsass_direct_syscall: >-
      Needs Sysmon EID 10 call stacks (see above).
    wmi_event_command_line_consumer: >-
      No pySigma Sentinel pipeline maps Sysmon EID 19-21; Defender's DeviceEvents
      WmiBindEventFilterToConsumer is a hand-written follow-up.
    win_system_service_install_shell_imagepath: >-
      System channel events land in the Event table as raw XML; no pipeline maps them.
    win_security_scheduled_task_masquerading_microsoft_path: >-
      The SecurityEvent pipeline has no TaskName mapping for 4698.
    registry_set_run_key_script_interpreter: >-
      Converted query failed a semantic check (literal '*' in an endswith); Defender
      splits Sysmon's TargetObject into key and value name.
    registry_set_eventlog_service_disabled: >-
      Converted query compares Sysmon's "DWORD (0x...)" format against Defender's
      RegistryValueData, which stores plain numbers, so it would never match.
    registry_set_cmdline_auditing_disabled: >-
      Same DWORD formatting mismatch as registry_set_eventlog_service_disabled.
    registry_set_ms_settings_uac_bypass: >-
      Converted query matches the value name against RegistryKey; Defender stores it
      in RegistryValueName, so it would never match.
