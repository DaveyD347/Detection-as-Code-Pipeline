alert.severity = 4
action.correlationsearch.enabled = 1
action.correlationsearch.label = Service Installed With a Shell Command as Its Binary Path
action.correlationsearch.annotations = {"mitre_attack": ["T1543.003", "T1569.002"]}
action.notable.param.rule_description = Detects a new service (System 7045) whose ImagePath launches cmd, PowerShell or another interpreter, or uses an encoded command. This is the install-time half of PsExec-style execution and fires even if the service fails to start or the process creation event is missed.
action.notable.param.security_domain = endpoint
action.notable.param.severity = high
