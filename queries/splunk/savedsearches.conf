[DaC - LSASS Opened via Direct System Call]
search = `dac_windows_process_access` TargetImage="*\\lsass.exe" CallTrace="*|*" NOT (CallTrace IN ("C:\\Windows\\System32\\ntdll.dll+*", "C:\\Windows\\SysWOW64\\ntdll.dll+*", "C:\\Windows\\System32\\win32u.dll+*"))
description = Every legitimate handle request reaches the kernel through ntdll.dll, so the first frame of a Sysmon CallTrace is an ntdll (or win32u) address. Tools such as Dumpert, NanoDump and SysWhispers-based loaders issue the syscall instruction from their own code to step around user-mode EDR hooks; Sysmon then records the tool's own module as the first frame. That evasion is itself the detection.
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = -5m@m
alert.severity = 4
action.correlationsearch.enabled = 1
action.correlationsearch.label = LSASS Opened via Direct System Call
action.correlationsearch.annotations = {"mitre_attack": ["T1003.001", "T1106"]}
action.notable.param.rule_description = Every legitimate handle request reaches the kernel through ntdll.dll, so the first frame of a Sysmon CallTrace is an ntdll (or win32u) address. Tools such as Dumpert, NanoDump and SysWhispers-based loaders issue the syscall instruction from their own code to step around user-mode EDR hooks; Sysmon then records the tool's own module as the first frame. That evasion is itself the detection.
action.notable.param.security_domain = endpoint
action.notable.param.severity = high
# sigma id: d6a5eb01-5d1f-4212-b90e-a5459f225b7e

[DaC - LSASS Accessed From Unbacked (Injected) Memory]
search = `dac_windows_process_access` TargetImage="*\\lsass.exe" | regex CallTrace=".*ntdll\\.dll\\+[0-9a-fA-F]+\\|[^|]*KERNELBASE\\.dll\\+[0-9a-fA-F]+\\|UNKNOWN.*"
description = Sysmon records the call stack of every LSASS handle request. A frame marked UNKNOWN means the request came from memory that is not backed by a file on disk: shellcode, a reflectively loaded DLL, or an in-memory PowerShell assembly such as Invoke-Mimikatz. Legitimate software opens LSASS from code that lives in a signed module, so an unbacked frame is a strong signal regardless of which tool is used. Only the *direct* caller matters: the frame right after ntdll and KERNELBASE. .NET applications (Azure guest agent, PowerShell remoting hosts) also show UNKNOWN frames, but deeper in the stack, where JIT-compiled managed code calls framework methods that open the handle. Replay against the OTRF datasets surfaced exactly that noise from a naive "contains UNKNOWN". The regex avoids ^, $, \s, \d and lookarounds and is wrapped in .* so it behaves the same in PCRE (Splunk), RE2 (KQL) and Lucene's anchored regex dialect (Elastic).
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = -5m@m
alert.severity = 4
action.correlationsearch.enabled = 1
action.correlationsearch.label = LSASS Accessed From Unbacked (Injected) Memory
action.correlationsearch.annotations = {"mitre_attack": ["T1003.001", "T1055"]}
action.notable.param.rule_description = Sysmon records the call stack of every LSASS handle request. A frame marked UNKNOWN means the request came from memory that is not backed by a file on disk: shellcode, a reflectively loaded DLL, or an in-memory PowerShell assembly such as Invoke-Mimikatz. Legitimate software opens LSASS from code that lives in a signed module, so an unbacked frame is a strong signal regardless of which tool is used. Only the *direct* caller matters: the frame right after ntdll and KERNELBASE. .NET applications (Azure guest agent, PowerShell remoting hosts) also show UNKNOWN frames, but deeper in the stack, where JIT-compiled managed code calls framework methods that open the handle. Replay against the OTRF datasets surfaced exactly that noise from a naive "contains UNKNOWN". The regex avoids ^, $, \s, \d and lookarounds and is wrapped in .* so it behaves the same in PCRE (Splunk), RE2 (KQL) and Lucene's anchored regex dialect (Elastic).
action.notable.param.security_domain = endpoint
action.notable.param.severity = high
