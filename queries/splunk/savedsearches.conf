[DaC - Service Installed With a Shell Command as Its Binary Path]
search = `dac_windows_system` source="WinEventLog:System" (Provider_Name="Service Control Manager" EventCode=7045) OR (SourceName="Service Control Manager" EventCode=7045) ImagePath IN ("*%COMSPEC%*", "*cmd.exe /c*", "*cmd /c*", "*powershell*", "*pwsh*", "*mshta*", "* -enc *", "* -e *", "* -nop *")
description = Detects a new service (System 7045) whose ImagePath launches cmd, PowerShell or another interpreter, or uses an encoded command. This is the install-time half of PsExec-style execution and fires even if the service fails to start or the process creation event is missed.
