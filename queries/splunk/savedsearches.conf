[DaC - WMI Provider Host Spawning a Shell or Script Host]
search = `dac_windows_process_creation` ParentImage="*\\WmiPrvSE.exe" Image IN ("*\\cmd.exe", "*\\powershell.exe", "*\\pwsh.exe", "*\\wscript.exe", "*\\cscript.exe", "*\\mshta.exe", "*\\rundll32.exe", "*\\regsvr32.exe") NOT CommandLine="*WerFault*"
description = Detects WmiPrvSE.exe starting a command interpreter. Win32_Process.Create, whether called locally or remotely over DCOM (wmic /node, Invoke-WmiMethod, Impacket wmiexec, Empire invoke_wmi), executes the new process as a child of WmiPrvSE, so this catches WMI-based execution regardless of the client tool.
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = -5m@m
alert.severity = 4
action.correlationsearch.enabled = 1
action.correlationsearch.label = WMI Provider Host Spawning a Shell or Script Host
action.correlationsearch.annotations = {"mitre_attack": ["T1047"]}
action.notable.param.rule_description = Detects WmiPrvSE.exe starting a command interpreter. Win32_Process.Create, whether called locally or remotely over DCOM (wmic /node, Invoke-WmiMethod, Impacket wmiexec, Empire invoke_wmi), executes the new process as a child of WmiPrvSE, so this catches WMI-based execution regardless of the client tool.
action.notable.param.security_domain = endpoint
action.notable.param.severity = high
