action.correlationsearch.annotations = {"mitre_attack": ["T1685.001", "T1112"]}
action.notable.param.rule_description = Detects creation of HKLM\SYSTEM\CurrentControlSet\Control\MiniNt. The key tells Windows it is running in WinPE; after the next reboot the Event Log service stops writing, so every downstream detection goes blind while the machine otherwise looks healthy.
action.notable.param.security_domain = endpoint
action.notable.param.severity = high
