action.notable.param.rule_description = Detects a Run or RunOnce value whose data starts PowerShell, a script host, mshta, rundll32 or regsvr32. Installers register executables under Run; registering an interpreter with inline arguments is how fileless persistence (Empire, Kovter-style loaders) survives a reboot.
action.notable.param.security_domain = endpoint
action.notable.param.severity = high
