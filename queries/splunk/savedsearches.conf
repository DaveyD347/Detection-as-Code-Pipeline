[DaC - DCSync - Directory Replication Requested by a User Account]
search = `dac_windows_security` source="WinEventLog:Security" EventCode=4662 AccessMask="0x100" Properties IN ("*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*", "*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*", "*89e95b76-444d-4c62-991a-0facbeda640c*") NOT (SubjectUserName IN ("*$", "MSOL_*"))
description = Detects directory replication rights (DS-Replication-Get-Changes and DS-Replication-Get-Changes-All) being exercised by an account that is not a domain controller computer account. Domain controllers replicate as MACHINE$; a user account replicating secrets is the signature of DCSync (mimikatz lsadump::dcsync, secretsdump, Empire, Covenant). Requires "Audit Directory Service Access" on domain controllers.
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = -5m@m
alert.severity = 4
action.correlationsearch.enabled = 1
action.correlationsearch.label = DCSync - Directory Replication Requested by a User Account
action.correlationsearch.annotations = {"mitre_attack": ["T1003.006"]}
action.notable.param.rule_description = Detects directory replication rights (DS-Replication-Get-Changes and DS-Replication-Get-Changes-All) being exercised by an account that is not a domain controller computer account. Domain controllers replicate as MACHINE$; a user account replicating secrets is the signature of DCSync (mimikatz lsadump::dcsync, secretsdump, Empire, Covenant). Requires "Audit Directory Service Access" on domain controllers.
action.notable.param.security_domain = endpoint
action.notable.param.severity = high
