dispatch.earliest_time = -15m@m
dispatch.latest_time = -5m@m
alert.severity = 5
action.correlationsearch.enabled = 1
action.correlationsearch.label = Zerologon - Computer Account Password Reset by ANONYMOUS LOGON
action.correlationsearch.annotations = {"mitre_attack": ["T1210"]}
action.notable.param.rule_description = Detects a computer account being changed by ANONYMOUS LOGON with a new password-set time. Exploiting CVE-2020-1472 (Zerologon) authenticates to Netlogon with an all-zero credential and then resets the domain controller's machine account password, which Windows logs as an anonymous 4742.
action.notable.param.security_domain = endpoint
action.notable.param.severity = critical
