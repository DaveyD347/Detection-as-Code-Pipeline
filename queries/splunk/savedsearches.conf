search = `dac_windows_process_creation` Image="*\\wevtutil.exe" OR OriginalFileName="wevtutil.exe" CommandLine IN ("* cl *", "* clear-log *") OR (CommandLine IN ("* sl *", "* set-log *") CommandLine="* -lfn:*" OR CommandLine="* /lfn:*" OR CommandLine="* –lfn:*" OR CommandLine="* —lfn:*" OR CommandLine="* ―lfn:*" OR CommandLine="* -logfilename:*" OR CommandLine="* /logfilename:*" OR CommandLine="* –logfilename:*" OR CommandLine="* —logfilename:*" OR CommandLine="* ―logfilename:*" OR CommandLine="* -e:false*" OR CommandLine="* /e:false*" OR CommandLine="* –e:false*" OR CommandLine="* —e:false*" OR CommandLine="* ―e:false*" OR CommandLine="* -enabled:false*" OR CommandLine="* /enabled:false*" OR CommandLine="* –enabled:false*" OR CommandLine="* —enabled:false*" OR CommandLine="* ―enabled:false*")
description = Detects wevtutil clearing an event log, disabling it, or pointing the Security log at a different file. Redirecting the log file is quieter than clearing it: no 1102 event is written, and new events land somewhere nobody collects.
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = -5m@m
alert.severity = 4
action.correlationsearch.enabled = 1
action.correlationsearch.label = Event Log Cleared or Redirected via wevtutil
action.correlationsearch.annotations = {"mitre_attack": ["T1685.001", "T1685.005"]}
action.notable.param.rule_description = Detects wevtutil clearing an event log, disabling it, or pointing the Security log at a different file. Redirecting the log file is quieter than clearing it: no 1102 event is written, and new events land somewhere nobody collects.
action.notable.param.security_domain = endpoint
action.notable.param.severity = high
