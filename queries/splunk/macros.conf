# Data-source macros used by savedsearches.conf. Adjust to your indexes.

[dac_windows_file_event]
definition = (index=* sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=11)

[dac_windows_process_access]
definition = (index=* sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=10)

[dac_windows_process_creation]
definition = (index=* ((sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1) OR (source=XmlWinEventLog:Security EventCode=4688)))

[dac_windows_registry_add]
definition = (index=* sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=12)

[dac_windows_registry_set]
definition = (index=* sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=13)

[dac_windows_security]
definition = (index=* source=XmlWinEventLog:Security)

[dac_windows_system]
definition = (index=* source=XmlWinEventLog:System)

[dac_windows_wmi_event]
definition = (index=* sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode IN (19,20,21))
